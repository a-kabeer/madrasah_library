<!DOCTYPE html>
<html>
<head>
    <title>Edit Location</title>
</head>
<body>

{% include "library/_account_bar.html" %}

<h1>Edit Location</h1>

<form method="post">
    {% csrf_token %}

    <label>Name:</label>
    <input
        type="text"
        name="name"
        value="{{ location.name }}"
        required
    >

    <br><br>

    <label>Description:</label>
    <textarea name="description">{{ location.description|default:'' }}</textarea>

    <br><br>

    <button type="submit">
        Update Location
    </button>
</form>

<br>

<a href="{% url 'location_detail' location.id %}">
    Back to {{ location.name }}
</a>

</body>
</html>
