<form hx-post="{% url 'publisher_add' %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}

    {% if error %}
        <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>{{ error }}</div>
        </div>
    {% endif %}

    <div class="mb-3">
        <label for="quickAddPublisherName" class="form-label fw-semibold">
            Publisher Name <span class="text-danger">*</span>
        </label>
        <input
            type="text"
            class="form-control"
            id="quickAddPublisherName"
            name="name"
            value="{{ form_data.name }}"
            required
            autofocus
        >
    </div>

    <div class="mb-3">
        <label for="quickAddPublisherCity" class="form-label fw-semibold">
            City
        </label>
        <input
            type="text"
            class="form-control"
            id="quickAddPublisherCity"
            name="city"
            value="{{ form_data.city }}"
        >
    </div>

    <div class="d-flex justify-content-end gap-2">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i> Save Publisher
        </button>
    </div>
</form>
