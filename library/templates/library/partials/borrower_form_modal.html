{% load i18n %}
<h5 class="modal-title" id="formModalLabel" hx-swap-oob="true">
    <i class="bi bi-person-plus me-2" aria-hidden="true"></i>
    {% if mode == "edit" %}{% translate "Edit Borrower" %}{% else %}{% translate "Add Borrower" %}{% endif %}
</h5>

<form
    id="borrowerForm"
    hx-post="{% if mode == 'edit' %}{% url 'borrower_edit' borrower.id %}{% else %}{% url 'borrower_add' %}{% endif %}?modal=1"
    hx-target="#borrowerForm"
    hx-swap="outerHTML"
    hx-disabled-elt="find button[type=submit]"
>
    {% csrf_token %}
    {% if error %}
        <div class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>{{ error }}
        </div>
    {% endif %}

    <div class="row g-3">
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" for="borrowerName">{% translate "Name" %}</label>
            <input id="borrowerName" name="name" type="text" class="form-control" value="{{ form_data.name }}" required autofocus>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" for="borrowerPhone">{% translate "Phone" %}</label>
            <input id="borrowerPhone" name="phone" type="text" class="form-control" value="{{ form_data.phone }}" required>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" for="borrowerType">{% translate "Borrower Type" %}</label>
            <select id="borrowerType" name="borrower_type" class="form-select" required>
                <option value="">{% translate "Select type" %}</option>
                {% for option in borrower_types %}
                    <option value="{{ option }}" {% if form_data.borrower_type == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" for="borrowerReg">{% translate "Registration No" %}</label>
            <input id="borrowerReg" name="registration_no" type="text" class="form-control" value="{{ form_data.registration_no }}">
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" for="borrowerDepartment">{% translate "Department" %}</label>
            <input id="borrowerDepartment" name="department" type="text" class="form-control" value="{{ form_data.department }}">
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" for="borrowerAddress">{% translate "Address" %}</label>
            <input id="borrowerAddress" name="address" type="text" class="form-control" value="{{ form_data.address }}">
        </div>
        <div class="col-12">
            <label class="form-label fw-semibold" for="borrowerNotes">{% translate "Notes" %}</label>
            <textarea id="borrowerNotes" name="notes" class="form-control" rows="3">{{ form_data.notes }}</textarea>
        </div>
        {% if mode == "edit" %}
            <div class="col-12">
                <input type="hidden" name="is_active" value="False">
                <div class="form-check form-switch">
                    <input class="form-check-input" id="borrowerActive" name="is_active" value="True" type="checkbox" {% if form_data.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="borrowerActive">{% translate "Borrower is active" %}</label>
                </div>
            </div>
        {% endif %}
    </div>

    <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">{% translate "Cancel" %}</button>
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1" aria-hidden="true"></i>
            {% if mode == "edit" %}{% translate "Save Changes" %}{% else %}{% translate "Add Borrower" %}{% endif %}
        </button>
    </div>
</form>
