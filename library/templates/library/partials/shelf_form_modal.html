{% load i18n %}
<h5 class="modal-title" id="formModalLabel" hx-swap-oob="true"><i class="bi {% if editing %}bi-pencil{% else %}bi-plus-lg{% endif %} me-2" aria-hidden="true"></i>{% if editing %}{% translate "Edit Shelf" %}{% else %}{% translate "Add Shelf" %}{% endif %}</h5>
<form id="shelfModalForm" method="post" {% if editing %}action="{% url 'shelf_edit' shelf.id %}" hx-post="{% url 'shelf_edit' shelf.id %}?modal=1"{% else %}action="{% url 'shelf_add' %}" hx-post="{% url 'shelf_add' %}?modal=1"{% endif %} hx-target="#shelfModalForm" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]" hx-disinherit="*">
    {% csrf_token %}
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <div class="mb-3"><label for="shelfLocationModal" class="form-label fw-semibold">{% translate "Location" %}</label><select id="shelfLocationModal" name="location" class="form-select" required><option value="">{% translate "Choose a location" %}</option>{% for location in locations %}<option value="{{ location.id }}" {% if location_id == location.id|stringformat:"s" %}selected{% endif %}>{{ location.name }}</option>{% endfor %}</select></div>
    <div class="mb-3"><label for="shelfCodeModal" class="form-label fw-semibold">{% translate "Shelf Code" %}</label><input id="shelfCodeModal" name="shelf_code" class="form-control" value="{{ shelf_code }}" maxlength="100" required></div>
    <div class="mb-3"><label for="shelfDescriptionModal" class="form-label fw-semibold">{% translate "Description" %} <span class="text-body-secondary fw-normal">({% translate "optional" %})</span></label><textarea id="shelfDescriptionModal" name="description" class="form-control" rows="3" maxlength="1000">{{ description }}</textarea></div>
    <div class="d-flex gap-2 mt-4 pt-3 border-top"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>{% if editing %}{% translate "Save Changes" %}{% else %}{% translate "Add Shelf" %}{% endif %}</button><button type="button" class="btn btn-outline-secondary ms-auto" data-bs-dismiss="modal">{% translate "Cancel" %}</button></div>
</form>
