{% load i18n %}
<h5 class="modal-title" id="formModalLabel" hx-swap-oob="true"><i class="bi {% if editing %}bi-pencil{% else %}bi-plus-lg{% endif %} me-2" aria-hidden="true"></i>{% if editing %}{% translate "Edit Content" %}{% else %}{% translate "Add Content" %}{% endif %}</h5>
<form id="bookContentModalForm" method="post" hx-post="?modal=1{% if request.GET.next %}&amp;next={{ request.GET.next|urlencode }}{% endif %}" hx-target="#bookContentModalForm" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]" hx-disinherit="*">
{% csrf_token %}{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<div class="mb-3"><label for="contentVolume" class="form-label fw-semibold">{% translate "Volume" %}</label><select id="contentVolume" name="volume" class="form-select" required autofocus><option value="">{% translate "Choose a volume" %}</option>{% for item in volumes %}<option value="{{ item.id }}" {% if item.id|stringformat:"s" == volume_id|stringformat:"s" %}selected{% endif %}>{{ item.book.title }} — {% translate "Volume" %} {{ item.volume_number }}{% if item.title %} — {{ item.title }}{% endif %}</option>{% endfor %}</select></div>
<div class="mb-3"><label for="contentParent" class="form-label fw-semibold">{% translate "Parent" %} <span class="text-body-secondary fw-normal">({% translate "optional" %})</span></label><select id="contentParent" name="parent" class="form-select"><option value="">{% translate "No parent" %}</option>{% for item in parents %}<option value="{{ item.id }}" {% if item.id|stringformat:"s" == parent_id|stringformat:"s" %}selected{% endif %}>{{ item.title }}</option>{% endfor %}</select></div>
<div class="mb-3"><label for="contentTitle" class="form-label fw-semibold">{% translate "Title" %}</label><input id="contentTitle" name="title" maxlength="500" class="form-control" value="{{ title }}" required></div>
<div class="row g-3"><div class="col-sm-4"><label for="contentType" class="form-label fw-semibold">{% translate "Content Type" %}</label><input id="contentType" name="content_type" maxlength="50" class="form-control" value="{{ content_type }}"></div><div class="col-sm-4"><label for="contentPage" class="form-label fw-semibold">{% translate "Page Number" %}</label><input id="contentPage" name="page_number" type="number" min="1" class="form-control" value="{{ page_number }}"></div><div class="col-sm-4"><label for="contentOrder" class="form-label fw-semibold">{% translate "Sort Order" %}</label><input id="contentOrder" name="sort_order" type="number" min="0" class="form-control" value="{{ sort_order }}"></div></div>
<div class="d-flex gap-2 mt-4 pt-3 border-top"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1" aria-hidden="true"></i>{% if editing %}{% translate "Save Changes" %}{% else %}{% translate "Add Content" %}{% endif %}</button><button type="button" class="btn btn-outline-secondary ms-auto" data-bs-dismiss="modal">{% translate "Cancel" %}</button></div>
</form>
