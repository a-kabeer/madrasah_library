{% load i18n %}
{% if user.is_authenticated %}
<p style="text-align:right;">
    {% blocktranslate trimmed with name=user.full_name role=user.role %}
        Logged in as <strong>{{ name }}</strong> ({{ role }})
    {% endblocktranslate %}
    |
    <a href="{% url 'profile' %}">{% translate "My Profile" %}</a>
    |
    <a href="{% url 'logout' %}">{% translate "Log Out" %}</a>
</p>
{% endif %}
