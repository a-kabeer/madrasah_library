{% extends "library/base.html" %}

{% block title %}
    Add Book | Madrasah Library
{% endblock %}

{% block page_title %}
    Add Book
{% endblock %}

{% block content %}

<div class="container-fluid px-0">

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-plus-lg me-2"></i>Add New Book
                    </h5>
                </div>
                <div class="card-body">

                    {% if error %}
                        <div class="alert alert-danger d-flex align-items-center" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <div>{{ error }}</div>
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="formTitle" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                            <input
                                type="text"
                                class="form-control"
                                id="formTitle"
                                name="title"
                                value="{{ form_data.title }}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="formAuthor" class="form-label fw-semibold mb-0">Author <span class="text-danger">*</span></label>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary quick-add-btn"
                                    data-bs-toggle="modal"
                                    data-bs-target="#globalModal"
                                    data-select="#formAuthor"
                                    data-title="Add New Author"
                                    hx-get="{% url 'author_add' %}"
                                    hx-target="#globalModal .modal-body"
                                    hx-swap="innerHTML"
                                >
                                    <i class="bi bi-plus-lg me-1"></i>Add New
                                </button>
                            </div>
                            <select class="form-select mt-2" id="formAuthor" name="author" required>
                                <option value="">Select Author</option>
                                {% for author in authors %}
                                    <option
                                        value="{{ author.id }}"
                                        {% if form_data.author == author.id|stringformat:"s" %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ author.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="formCategory" class="form-label fw-semibold mb-0">Category</label>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary quick-add-btn"
                                    data-bs-toggle="modal"
                                    data-bs-target="#globalModal"
                                    data-select="#formCategory"
                                    data-title="Add New Category"
                                    hx-get="{% url 'category_add' %}"
                                    hx-target="#globalModal .modal-body"
                                    hx-swap="innerHTML"
                                >
                                    <i class="bi bi-plus-lg me-1"></i>Add New
                                </button>
                            </div>
                            <select class="form-select mt-2" id="formCategory" name="category">
                                <option value="">Select Category</option>
                                {% for category in categories %}
                                    <option
                                        value="{{ category.id }}"
                                        {% if form_data.category == category.id|stringformat:"s" %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ category.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="formPublisher" class="form-label fw-semibold mb-0">Publisher</label>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary quick-add-btn"
                                    data-bs-toggle="modal"
                                    data-bs-target="#globalModal"
                                    data-select="#formPublisher"
                                    data-title="Add New Publisher"
                                    hx-get="{% url 'publisher_add' %}"
                                    hx-target="#globalModal .modal-body"
                                    hx-swap="innerHTML"
                                >
                                    <i class="bi bi-plus-lg me-1"></i>Add New
                                </button>
                            </div>
                            <select class="form-select mt-2" id="formPublisher" name="publisher">
                                <option value="">Select Publisher</option>
                                {% for publisher in publishers %}
                                    <option
                                        value="{{ publisher.id }}"
                                        {% if form_data.publisher == publisher.id|stringformat:"s" %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ publisher.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i> Add Book
                            </button>
                            <a href="{% url 'book_list' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i> Cancel
                            </a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
