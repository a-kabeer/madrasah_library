<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>
</head>
<body>

{% include "library/_account_bar.html" %}

<h1>Add Book</h1>

{% if error %}
    <p style="color: red;">
        {{ error }}
    </p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label>Title:</label>
    <input type="text" name="title" value="{{ form_data.title }}" required>

    <br><br>

    <label>Author:</label>
    <select name="author" required>
        <option value="">Select Author</option>

        {% for author in authors %}
            <option
                value="{{ author.id }}"
                {% if form_data.author == author.id|stringformat:"s" %}
                    selected
                {% endif %}
            >
                {{ author.name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Category:</label>
    <select name="category">
        <option value="">Select Category</option>

        {% for category in categories %}
            <option
                value="{{ category.id }}"
                {% if form_data.category == category.id|stringformat:"s" %}
                    selected
                {% endif %}
            >
                {{ category.name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Publisher:</label>
    <select name="publisher">
        <option value="">Select Publisher</option>

        {% for publisher in publishers %}
            <option
                value="{{ publisher.id }}"
                {% if form_data.publisher == publisher.id|stringformat:"s" %}
                    selected
                {% endif %}
            >
                {{ publisher.name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">
        Add Book
    </button>
</form>

<br>

<a href="{% url 'book_list' %}">
    Back to Books
</a>

</body>
</html>
