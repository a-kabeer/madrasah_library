<!DOCTYPE html>
<html>
<head>
    <title>Add Book Volume</title>
</head>
<body>

{% include "library/_account_bar.html" %}

<h1>Add Book Volume</h1>

{% if error %}
    <p style="color: red;">
        {{ error }}
    </p>
{% endif %}

{% if selected_book_id %}

    <a href="{% url 'book_detail' selected_book_id %}">
        ← Back to Book
    </a>

{% else %}

    <a href="{% url 'book_volume_list' %}">
        ← Back to Volumes
    </a>

{% endif %}

<form method="post">
    {% csrf_token %}

    <label>Book:</label>

<select name="book" required>

    <option value="">Select Book</option>

    {% for book in books %}

        <option
            value="{{ book.id }}"
            {% if selected_book_id == book.id|stringformat:"s" %}
                selected
            {% endif %}
        >
            {{ book.title }}
        </option>

    {% endfor %}

</select>

    <br><br>

    <label>Volume Number:</label>
    <input type="number" name="volume_number" min="1" value="{{ volume_number }}" required>

    <br><br>

    <label>Title:</label>
    <input type="text" name="title" value="{{ title }}" required>

    <br><br>

    <button type="submit">
        Add Volume
    </button>
</form>



</body>
</html>
