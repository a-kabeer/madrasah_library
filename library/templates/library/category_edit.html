<!DOCTYPE html>
<html>
<head>
    <title>Edit Category</title>
</head>
<body>

{% include "library/_account_bar.html" %}

<h1>Edit Category</h1>

<form method="post">
    {% csrf_token %}

    <label for="name">Category Name:</label>

    <input
        type="text"
        id="name"
        name="name"
        value="{{ category.name }}"
        required
    >

    <button type="submit">Update Category</button>
</form>

<br>

<a href="{% url 'category_list' %}">
    Back to Categories
</a>

</body>
</html>
