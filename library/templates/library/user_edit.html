<!DOCTYPE html>

<html>

<head>

    <title>Edit User</title>

</head>

<body>

{% include "library/_account_bar.html" %}

<h1>Edit User</h1>

{% if error %}
    <p style="color: red;">
        <strong>{{ error }}</strong>
    </p>
{% endif %}

<form method="post">

    {% csrf_token %}

    <label>
        Username:
    </label>

    <input
        type="text"
        name="username"
        value="{{ target_user.username }}"
        required
    >

    <br><br>


    <label>
        Full Name:
    </label>

    <input
        type="text"
        name="full_name"
        value="{{ target_user.full_name|default:'' }}"
        required
    >

    <br><br>


    <label>
        New Password:
    </label>

    <input
        type="password"
        name="new_password"
        placeholder="Leave empty to keep current"
    >

    <br><br>


    <label>
        Role:
    </label>

    <select
        name="role"
        required
    >

        <option
            value="Admin"
            {% if target_user.role == "Admin" %}
                selected
            {% endif %}
        >
            Admin
        </option>

        <option
            value="Librarian"
            {% if target_user.role == "Librarian" %}
                selected
            {% endif %}
        >
            Librarian
        </option>

        <option
            value="Assistant"
            {% if target_user.role == "Assistant" %}
                selected
            {% endif %}
        >
            Assistant
        </option>

    </select>

    <br><br>


    <label>

        <input
            type="checkbox"
            name="is_active"
            {% if target_user.is_active %}
                checked
            {% endif %}
        >

        Active User

    </label>

    <br><br>


    <button type="submit">

        Update User

    </button>

</form>

<br>

<a href="{% url 'user_list' %}">

    ← Back to Users

</a>

</body>

</html>
