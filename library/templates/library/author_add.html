<!DOCTYPE html>
<html>
<head>
    <title>Add Author</title>
</head>
<body>

{% include "library/_account_bar.html" %}

<h1>Add Author</h1>

{% if error %}
    <p style="color: red;">
        {{ error }}
    </p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="name">Author Name:</label>

    <input
        type="text"
        id="name"
        name="name"
        value="{{ name }}"
        required
    >

    <button type="submit">Add Author</button>
</form>

<br>

<a href="{% url 'author_list' %}">
    Back to Authors
</a>

</body>
</html>
