<!DOCTYPE html>
<html>
<head>
    <title>Delete User</title>
</head>
<body>

{% include "library/_account_bar.html" %}

<h1>Delete User</h1>

<p>
    Are you sure you want to delete:
    <strong>{{ user.username }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>
</form>

<br>

<a href="{% url 'user_list' %}">
    Cancel
</a>

</body>
</html>
