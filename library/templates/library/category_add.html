<!DOCTYPE html>
<html>
<head>
    <title>Add Category</title>
</head>
<body>

{% include "library/_account_bar.html" %}

<h1>Add Category</h1>

{% if error %}
    <p style="color: red;">
        {{ error }}
    </p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="name">Category Name:</label>
    <input
        type="text"
        id="name"
        name="name"
        value="{{ name }}"
        required
    >

    <button type="submit">Add Category</button>
</form>

<br>

<a href="{% url 'category_list' %}">
    Back to Categories
</a>

</body>
</html>
