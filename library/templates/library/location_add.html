{% extends layout %}
{% load i18n %}

{% block title %}
    Add Location | {{ branding.display_name }}
{% endblock %}

{% block page_title %}
    Add Location
{% endblock %}

{% block content %}

<div class="container-fluid px-0">

    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">

            <div class="card shadow-sm border-0">
                <div class="card-header bg-body">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-plus-lg me-2"></i>Add Location
                    </h5>
                </div>
                <div class="card-body">

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="formName" class="form-label fw-semibold">
                                Name <span class="text-danger">*</span>
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="formName"
                                name="name"
                                value=""
                                required
                            >
                            <div class="form-text">
                                A place in the building, e.g. "Main Hall".
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="formDescription" class="form-label fw-semibold">
                                {% translate "Description" %}
                            </label>
                            <textarea
                                class="form-control"
                                id="formDescription"
                                name="description"
                                rows="3"
                            ></textarea>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i> Add Location
                            </button>
                            <a href="{% url 'location_list' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i> Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
