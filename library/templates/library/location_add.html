<!DOCTYPE html>
<html>
<head>
    <title>Add Location</title>
</head>
<body>

{% include "library/_account_bar.html" %}

<h1>Add Location</h1>

<form method="post">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Description:</label>
    <textarea name="description"></textarea>

    <br><br>

    <button type="submit">
        Add Location
    </button>
</form>

<br>

<a href="{% url 'location_list' %}">
    Back to Locations
</a>

</body>
</html>
