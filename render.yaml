databases:
  - name: madrasah-library-db
    plan: free
    databaseName: madrasah_library
    user: madrasah_library

services:
  - type: web
    name: madrasah-library
    env: python
    plan: free
    # `migrate` was missing here, so schema changes never reached the
    # deployed database. All app models are managed=False, so migrate only
    # runs the explicit RunSQL in library/migrations — each guarded with
    # IF NOT EXISTS, making it safe to re-run on every deploy.
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: madrasah-library-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: madrasah-library-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: madrasah-library-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: madrasah-library-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: madrasah-library-db
          property: port
