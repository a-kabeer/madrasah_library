name: Clean remaining committed conflict markers

on:
  push:
    branches:
      - audit/task-3-modal-conversion

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: audit/task-3-modal-conversion
          fetch-depth: 1

      - name: Remove conflict markers while keeping HEAD side
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'library/templates/library/partials/copy_move_modal.html',
              'library/templates/library/shelf_detail.html',
              'library/templates/library/user_list.html',
          ]

          for name in files:
              path = Path(name)
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              output = []
              state = 'normal'

              for line in lines:
                  if line.startswith('<<<<<<< '):
                      if state != 'normal':
                          raise SystemExit(f'Nested conflict in {name}')
                      state = 'head'
                      continue
                  if state == 'head' and line.startswith('======='):
                      state = 'incoming'
                      continue
                  if state == 'incoming' and line.startswith('>>>>>>> '):
                      state = 'normal'
                      continue
                  if state in ('normal', 'head'):
                      output.append(line)

              if state != 'normal':
                  raise SystemExit(f'Unclosed conflict in {name}')
              path.write_text(''.join(output), encoding='utf-8')
          PY

      - name: Validate, commit, and remove workflow
        run: |
          set -e
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>> )' -- ':!library/static/library/css/style.css'; then
            echo 'Conflict markers remain.'
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile-main-into-task-branch.yml
          git add library/templates
          git diff --cached --check
          git commit -m 'Remove remaining committed conflict markers'
          git push origin HEAD:audit/task-3-modal-conversion
