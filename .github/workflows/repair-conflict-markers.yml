# One-time repository repair; removes committed Git conflict blocks while preserving branch-side code.
name: Repair committed merge conflict markers

on:
  push:
    branches:
      - audit/task-3-modal-conversion

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/task-3-modal-conversion
          fetch-depth: 1

      - name: Remove committed conflict blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              'library/templates/library/book_copy_list.html',
              'library/templates/library/book_detail.html',
              'library/templates/library/book_volume_detail.html',
              'library/templates/library/partials/book_form_fields.html',
              'library/templates/library/partials/borrower_delete_modal.html',
              'library/templates/library/partials/borrower_detail_modal.html',
              'library/templates/library/partials/borrower_form_modal.html',
              'library/templates/library/partials/copy_detail_modal.html',
              'library/templates/library/partials/copy_list_results.html',
          ]

          block = re.compile(r'^<<<<<<<[^\n]*\n(.*?)^=======\n.*?^>>>>>>>[^\n]*\n?', re.MULTILINE | re.DOTALL)

          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              while '<<<<<<<' in text:
                  text, count = block.subn(r'\1', text, count=1)
                  if count != 1:
                      raise SystemExit(f'Could not resolve conflict block in {name}')
              if re.search(r'^<<<<<<<|^>>>>>>>', text, re.MULTILINE) or re.search(r'^=======\s*$', text, re.MULTILINE):
                  raise SystemExit(f'Conflict markers remain in {name}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          set -e
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-conflict-markers.yml
          git add library/templates
          git diff --cached --check
          git commit -m 'Repair committed merge conflict markers'
          git push origin HEAD:audit/task-3-modal-conversion
